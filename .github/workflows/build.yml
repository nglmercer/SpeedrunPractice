name: CI Build and Release

# Plan section 6: CI must show what is actually supported. The version modules
# compile as plain Java (adapter skeletons whose live methods throw pending),
# so their jars are NEVER playable mods and must never be uploaded or released
# as such. Only the legacy 1.16.1 Loom runtime ships until a version adapter
# is wired, tested in-game, and marked supported in docs/version-status.md.
on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  shared-tests:
    name: shared-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test shared modules
        run: ./gradlew :common:build :practices:build :seed-search:build :test-support:build

      - name: Verify architecture guard (offline script)
        run: sh scripts/verify-architecture.sh

  adapter-compilation:
    # Temporary plan-section-6 category: proves the adapter skeletons compile
    # against the shared engine. NOT a playable mod build; produces no release
    # artifact. Replaced by real per-version Loom builds as each version ports.
    name: ${{ matrix.category }} (compilation check, not a playable mod)
    needs: shared-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - module: fabric-1.16.1
            category: new-116-adapter
            java-version: '17'
          - module: fabric-1.21.1
            category: 121-runtime
            java-version: '21'
          - module: fabric-26.3
            category: 263-runtime
            java-version: '25'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile adapter module (no jar published)
        run: ./gradlew :versions:${{ matrix.module }}:build -x jar

      - name: Report pending adapter methods (informational)
        run: |
          count=$(grep -r "throw pending" versions/${{ matrix.module }}/src 2>/dev/null | wc -l)
          echo "versions/${{ matrix.module }} has $count pending adapter call sites (expected until ported)"

      - name: Guard supported versions (fail on support claims with pending code)
        run: sh scripts/verify-supported-versions.sh

  legacy-116-runtime:
    # The only playable mod jar: the untouched legacy 1.16.1 Fabric runtime.
    name: legacy-116-runtime
    needs: shared-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build legacy runtime
        run: ./gradlew :build -x :common:build -x :practices:build -x :seed-search:build -x :test-support:build

      - name: Upload legacy jar
        uses: actions/upload-artifact@v4
        with:
          name: legacy-116-runtime
          path: build/libs/*.jar

  release:
    # Plan sections 6, 72, 98: a release ships only modules with no pending()
    # on any normal practice path. The adapter skeletons always contain
    # pending(), so this job depends only on shared-tests + legacy-116-runtime
    # and downloads only the legacy jar.
    needs: [ shared-tests, legacy-116-runtime ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download legacy jar only
        uses: actions/download-artifact@v4
        with:
          name: legacy-116-runtime
          path: artifacts

      - name: Guard against pending adapter code in the release
        run: |
          ls artifacts
          if ls artifacts/*1.16.1*.jar artifacts/*1.21.1*.jar artifacts/*26.3*.jar >/dev/null 2>&1; then
            echo "Refusing to release: adapter skeleton jars must never ship as mods" >&2
            exit 1
          fi

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.jar > sha256sums.txt
          cat sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.jar
            artifacts/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
