pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}
rootProject.name="speedrun_practice"

// Multi-module layout (plan section 7). The root project keeps the original
// Fabric Loom 1.16.1 runtime in src/ so the baseline build is untouched;
// :versions:fabric-1.16.1 is the migration target holding the 1.16.1 adapter set.
include ':common'
include ':practices'
include ':seed-search'
include ':test-support'
include ':versions:fabric-1.16.1'
include ':versions:fabric-1.21.1'
include ':versions:fabric-26.3'
