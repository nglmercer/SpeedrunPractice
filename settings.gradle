pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}
rootProject.name="speedrun_practice"

// Multi-module layout (plan section 7). The root project is aggregator-only;
// :versions:fabric-1.16.1 is the real 1.16.1 Fabric/Loom mod (runtime
// migrated from root src/ in plan step 12).
include ':common'
include ':practices'
include ':seed-search'
include ':test-support'
include ':verification:common'
include ':versions:fabric-1.16.1'
include ':versions:fabric-1.21.1'
include ':versions:fabric-26.3'
