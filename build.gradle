// Aggregator-only root (plan step 12): the 1.16.1 Fabric/Loom runtime lives
// in :versions:fabric-1.16.1. This file only pins shared coordinates and
// repositories for the plain-Java modules; each Loom module carries its own
// buildscript + plugin wiring (see versions/fabric-1.16.1/build.gradle and
// versions/fabric-26.3/build.gradle).

version = project.mod_version
group = project.maven_group

// Shared modules resolve JUnit and other plain-Java deps from Maven Central.
// All modules share the mod version so Jar-in-Jar nested jars report a real
// version instead of "unspecified" in the loader log.
subprojects {
    version = rootProject.property('mod_version')
    repositories {
        mavenCentral()
    }
}

// Verification is deliberately explicit. The root remains aggregator-only;
// these lifecycle tasks orchestrate shared tests, fixture validation and the
// version-local verification artifacts without putting verification classes
// in any release jar.
def verificationCommon = project(':verification:common')

tasks.register('test') {
    group = 'verification'
    description = 'Runs the fast Minecraft-independent test pyramid.'
    dependsOn ':common:test', ':practices:test', ':seed-search:test',
            ':test-support:test', ':verification:common:test'
}

tasks.register('testWorldContracts') {
    group = 'verification'
    dependsOn ':common:test', ':practices:test', ':test-support:test'
}

tasks.register('testSeedSearch') {
    group = 'verification'
    dependsOn ':common:test', ':seed-search:test'
}

tasks.register('testAdapterContracts') {
    group = 'verification'
    description = 'Runs the shared adapter delegation contract tests for all supported versions.'
    dependsOn ':versions:fabric-1.16.1:test', ':versions:fabric-1.21.1:test',
            ':versions:fabric-26.3:test'
}

def fixtureTask = { String taskName, String version, String fixture ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Validates the canonical ${version} deterministic fixture."
        dependsOn verificationCommon.tasks.named('classes')
        classpath = verificationCommon.sourceSets.main.runtimeClasspath
        mainClass = 'com.gregor0410.speedrunpractice.verification.FixtureValidationMain'
        args version, fixture, "${rootProject.projectDir}/build/verification/${version}"
    }
}

def fixture116 = fixtureTask('validateFixture116', '1.16.1',
        "${rootProject.projectDir}/verification/fixtures/1.16.1.json")
def fixture121 = fixtureTask('validateFixture121', '1.21.1',
        "${rootProject.projectDir}/verification/fixtures/1.21.1.json")
def fixture263 = fixtureTask('validateFixture263', '26.3',
        "${rootProject.projectDir}/verification/fixtures/26.3.json")

def headlessTask = { String taskName, String shortVersion, String module, String suite ->
    tasks.register(taskName, Exec) {
        group = 'verification'
        description = "Boots the real ${shortVersion} dedicated server and runs the ${suite} verification suite."
        dependsOn ":${module}:verificationJar"
        doFirst {
            def serverJavaHome = project.findProperty("speedrunPracticeServerJavaHome${shortVersion}")
            def serverJavaVersion = project.findProperty('speedrunPracticeServerJavaVersion')
            def serverHeap = project.findProperty('speedrunPracticeServerHeap')
            List<String> command
            if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
                command = ['powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                           '-File', "${rootProject.projectDir}/scripts/verify-headless.ps1",
                           '-Version', shortVersion, '-Suite', suite]
                if (serverJavaHome != null && serverJavaHome.toString().trim()) {
                    command += ['-JavaHome', serverJavaHome.toString()]
                }
                if (serverHeap != null && serverHeap.toString().trim()) {
                    command += ['-ServerHeap', serverHeap.toString().trim()]
                }
            } else {
                command = ['bash', "${rootProject.projectDir}/scripts/verify-headless.sh",
                           '--version', shortVersion, '--suite', suite]
                if (serverJavaHome != null && serverJavaHome.toString().trim()) {
                    command += ['--java-home', serverJavaHome.toString().trim()]
                }
                if (serverJavaVersion != null && serverJavaVersion.toString().trim()) {
                    command += ['--server-java-version', serverJavaVersion.toString().trim()]
                }
                if (serverHeap != null && serverHeap.toString().trim()) {
                    command += ['--server-heap', serverHeap.toString().trim()]
                }
            }
            commandLine command
        }
    }
}

headlessTask('verifyHeadless116', '116', 'versions:fabric-1.16.1', 'lava')
headlessTask('verifyHeadless121', '121', 'versions:fabric-1.21.1', 'lava')
headlessTask('verifyHeadless263', '263', 'versions:fabric-26.3', 'lava')
headlessTask('verifyHeadlessFixtures116', '116', 'versions:fabric-1.16.1', 'fixtures')
headlessTask('verifyHeadlessFixtures121', '121', 'versions:fabric-1.21.1', 'fixtures')
headlessTask('verifyHeadlessFixtures263', '263', 'versions:fabric-26.3', 'fixtures')
headlessTask('verifyHeadlessAll116', '116', 'versions:fabric-1.16.1', 'all')
headlessTask('verifyHeadlessAll121', '121', 'versions:fabric-1.21.1', 'all')
headlessTask('verifyHeadlessAll263', '263', 'versions:fabric-26.3', 'all')

// Fast development loop (plan phase 16): one focused headless suite per
// version, e.g. `./gradlew verify121Worlds` after a world change or
// `./gradlew verify121Seeds` after a seed change.
def perSuiteTasks = [
        Worlds     : 'worlds',
        Structures : 'structures',
        Portals    : 'portals',
        Dragon     : 'dragon',
        Registries : 'registries',
        Seeds      : 'seed-search',
        Scenarios  : 'scenarios',
        Resets     : 'resets',
        Checkpoints: 'checkpoints',
        Eventbridge: 'eventbridge'
]
[
        ['116', 'versions:fabric-1.16.1'],
        ['121', 'versions:fabric-1.21.1'],
        ['263', 'versions:fabric-26.3']
].each { ver, module ->
    perSuiteTasks.each { name, suite ->
        headlessTask("verify${ver}${name}", ver, module, suite)
    }
}

tasks.register('verifyLava116') {
    group = 'verification'
    description = 'Runs the 1.16.1 Stage-B lava differential suite.'
    dependsOn 'verifyHeadless116'
}
tasks.register('verifyLava121') {
    group = 'verification'
    description = 'Runs the 1.21.1 Stage-B lava differential suite.'
    dependsOn 'verifyHeadless121'
}
tasks.register('verifyLava263') {
    group = 'verification'
    description = 'Runs the 26.3 Stage-B lava differential suite.'
    dependsOn 'verifyHeadless263'
}

def releaseBoundaryTask = { String taskName, String modulePath ->
    def module = project(modulePath)
    tasks.register(taskName) {
        group = 'verification'
        description = "Checks that ${modulePath} release jar contains no verification-only classes."
        dependsOn "${modulePath}:jar"
        doLast {
            def releaseJar = module.tasks.named('jar')
            File artifact = releaseJar.get().archiveFile.get().asFile
            def forbidden = zipTree(artifact).matching {
                include '**/*Probe*'
                include '**/Temp*'
                include '**/EventBridgeDriver*'
                include '**/VerificationEntrypoint*'
                include '**/verification/**'
            }.files
            if (!forbidden.isEmpty()) {
                throw new GradleException("Release jar boundary violation in ${artifact.name}: "
                        + forbidden.collect { it.name }.sort().join(', '))
            }
            // Tripwire for the verification-only lava probe marker: no
            // production class may emit it. Entry bytes are uncompressed
            // first (a raw jar scan would miss DEFLATEd strings).
            def markerHits = []
            def zip = new java.util.zip.ZipFile(artifact)
            try {
                zip.entries().each { entry ->
                    if (!entry.name.endsWith('.class')) {
                        return
                    }
                    byte[] bytes = zip.getInputStream(entry).bytes
                    if (new String(bytes, 'ISO-8859-1').contains('PROBELAVA')) {
                        markerHits += entry.name
                    }
                }
            } finally {
                zip.close()
            }
            if (!markerHits.isEmpty()) {
                throw new GradleException("Release jar boundary violation in ${artifact.name}: "
                        + "PROBELAVA marker in " + markerHits.sort().join(', '))
            }
            logger.lifecycle("Release jar boundary OK: ${artifact.name}")
        }
    }
}

releaseBoundaryTask('verifyReleaseJar116', ':versions:fabric-1.16.1')
releaseBoundaryTask('verifyReleaseJar121', ':versions:fabric-1.21.1')
releaseBoundaryTask('verifyReleaseJar263', ':versions:fabric-26.3')

tasks.register('verify116') {
    group = 'verification'
    description = 'Builds 1.16.1 and validates its verification artifact and fixture.'
    dependsOn 'test', 'testAdapterContracts', ':versions:fabric-1.16.1:build',
            ':versions:fabric-1.16.1:verificationJar', fixture116, 'verifyReleaseJar116',
            'verifyHeadless116'
}

tasks.register('verify121') {
    group = 'verification'
    description = 'Builds 1.21.1 and validates its verification artifact and fixture.'
    dependsOn 'test', 'testAdapterContracts', ':versions:fabric-1.21.1:build',
            ':versions:fabric-1.21.1:verificationJar', fixture121, 'verifyReleaseJar121',
            'verifyHeadless121'
}

tasks.register('verify263') {
    group = 'verification'
    description = 'Builds 26.3 and validates its verification artifact and fixture.'
    dependsOn 'test', 'testAdapterContracts', ':versions:fabric-26.3:build',
            ':versions:fabric-26.3:verificationJar', fixture263, 'verifyReleaseJar263',
            'verifyHeadless263'
}

// Every headless suite on every version. verifyAll gates the full pyramid:
// shared unit tests, adapter contracts, offline fixture validation, all
// three builds, the release-jar boundary checks, and each headless suite
// (per-suite suites + lava + fixtures + the all aggregate) per version.
// Gradle fails fast on the first failing dependency and every headless
// runner exits non-zero on any failed check, so verifyAll fails on any
// failure anywhere in the pyramid (plan phase 15).
def verifyAllHeadless = []
['116', '121', '263'].each { ver ->
    verifyAllHeadless += ["verifyHeadless${ver}", "verifyHeadlessFixtures${ver}",
            "verifyHeadlessAll${ver}"]
    perSuiteTasks.each { name, suite -> verifyAllHeadless += "verify${ver}${name}" }
}

tasks.register('verifyAll') {
    group = 'verification'
    description = 'Runs shared tests, all version build gates, and every verification suite on all versions.'
    dependsOn 'test', 'testAdapterContracts', fixture116, fixture121, fixture263,
            ':versions:fabric-1.16.1:build', ':versions:fabric-1.21.1:build',
            ':versions:fabric-26.3:build', 'verifyReleaseJar116', 'verifyReleaseJar121',
            'verifyReleaseJar263', verifyAllHeadless
}
