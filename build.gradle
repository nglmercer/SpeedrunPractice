// Aggregator-only root (plan step 12): the 1.16.1 Fabric/Loom runtime lives
// in :versions:fabric-1.16.1. This file only pins shared coordinates and
// repositories for the plain-Java modules; each Loom module carries its own
// buildscript + plugin wiring (see versions/fabric-1.16.1/build.gradle and
// versions/fabric-26.3/build.gradle).

version = project.mod_version
group = project.maven_group

// Shared modules resolve JUnit and other plain-Java deps from Maven Central.
// All modules share the mod version so Jar-in-Jar nested jars report a real
// version instead of "unspecified" in the loader log.
subprojects {
    version = rootProject.property('mod_version')
    repositories {
        mavenCentral()
    }
}
