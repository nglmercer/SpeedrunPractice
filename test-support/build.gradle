plugins {
    id 'java-library'
}

group = 'com.gregor0410'
description = 'Test fixtures: known-seed tables and in-memory adapter harness. No Minecraft imports.'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}

dependencies {
    api project(':common')
}
