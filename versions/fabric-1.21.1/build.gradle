plugins {
    id 'java-library'
}

group = 'com.gregor0410'
// 1.21.1 = modern compatibility/reference build (plan section 1).
// Skeleton adapter set; compiles offline as plain Java. Full Loom wiring
// needs Gradle 8 + JDK 21 (this repo pins Gradle 7.3, whose JavaVersion enum
// tops out at 17); see versions/README.md.
description = 'Minecraft 1.21.1 adapter set (modern compatibility build).'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}

dependencies {
    api project(':common')
    api project(':practices')
    api project(':seed-search')
}

jar {
    archiveBaseName = 'speedrun-practice-1.21.1'
}
