plugins {
    id 'java-library'
}

group = 'com.gregor0410'
// 1.21.1 = modern compatibility/reference build (plan section 1).
// Skeleton adapter set; compiles offline as plain Java. Full Loom wiring
// needs its Loom/Minecraft/loader dependencies plus a JDK 21+ toolchain;
// see versions/README.md.
description = 'Minecraft 1.21.1 adapter set (modern compatibility build).'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}

dependencies {
    api project(':common')
    api project(':practices')
    api project(':seed-search')
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    useJUnit()
}

jar {
    archiveBaseName = 'speedrun-practice-1.21.1'
}
