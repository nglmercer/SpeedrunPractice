buildscript {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.18.2'
    }
}

// NOTE: NoRemap plugin, not the `fabric-loom` remap one: 26.x ships
// unobfuscated, so this module needs no mappings and no remapJar. Applied by
// class because both Loom plugins ship in one artifact (see root build.gradle).
apply plugin: net.fabricmc.loom.LoomNoRemapGradlePlugin

group = 'com.gregor0410'
// 26.3 = latest supported build (plan section 1). Loom-wired: MC 26.x ships
// unobfuscated, so there is intentionally no `mappings` dependency.
description = 'Minecraft 26.3 adapter set (latest supported build).'

version = mod_version

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.mc263_minecraft_version}"
    // Plain `implementation`: unobfuscated MC needs no remapping of mod deps.
    implementation "net.fabricmc:fabric-loader:${project.mc263_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.mc263_fabric_version}"

    // Shared engine, bundled into the mod jar via `include` so the loader
    // never needs separate library mods.
    implementation project(':common')
    implementation project(':practices')
    implementation project(':seed-search')
    include project(':common')
    include project(':practices')
    include project(':seed-search')

    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    useJUnit()
}

def verificationServerJavaVersion = project.findProperty('speedrunPracticeServerJavaVersion')
if (verificationServerJavaVersion != null) {
    tasks.matching { it.name == 'runServer' }.configureEach {
        if (it instanceof JavaExec) {
            it.javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(
                        Integer.parseInt(verificationServerJavaVersion.toString()))
            }
        }
    }
}

// Verification suites create/delete 100+ worlds per run; the default
// runServer heap is too small for the aggregate suites.
def verificationServerHeap = project.findProperty('speedrunPracticeServerHeap')
if (verificationServerHeap != null && !verificationServerHeap.toString().trim().isEmpty()) {
    tasks.matching { it.name == 'runServer' }.configureEach {
        if (it instanceof JavaExec) {
            it.maxHeapSize = verificationServerHeap.toString().trim()
        }
    }
}

// Verification-only probes never enter the production mod jar.
sourceSets {
    verification {
        java.srcDir 'verification/src/main/java'
        resources.srcDir 'verification/src/main/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

configurations {
    verificationImplementation.extendsFrom implementation
}

dependencies {
    verificationImplementation rootProject.project(':verification:common')
}

tasks.named('compileVerificationJava') {
    classpath = project.files(tasks.named('compileJava').get().classpath,
            sourceSets.main.output, configurations.getByName('verificationCompileClasspath'))
}

tasks.register('verificationJar', Jar) {
    dependsOn tasks.named('compileVerificationJava')
    dependsOn rootProject.project(':verification:common').tasks.named('jar')
    archiveBaseName = 'speedrun-practice-verification-26.3'
    from sourceSets.verification.output
    from { zipTree(rootProject.project(':verification:common').tasks.named('jar').get().archiveFile) }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    archiveBaseName = 'speedrun-practice-26.3'
    exclude '**/Temp*Probe*'
    exclude '**/VerificationEntrypoint*'
    exclude '**/verification/**'
}
