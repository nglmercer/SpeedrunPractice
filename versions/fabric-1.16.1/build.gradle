buildscript {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
    }
    dependencies {
        // Applied by class below (see root build.gradle): both Loom plugins
        // ship in one artifact and Gradle cannot resolve both markers at once.
        classpath 'net.fabricmc:fabric-loom:1.18.2'
    }
}

// 1.16.1 = primary speedrunning build (plan section 1). Real Fabric/Loom
// module: the full runtime (legacy + new live adapter) migrated from the
// root project in plan step 12, so the root is aggregator-only.
apply plugin: net.fabricmc.loom.LoomGradlePlugin

group = 'com.gregor0410'
description = 'Minecraft 1.16.1 adapter set (primary speedrunning build).'

version = mod_version

repositories {
    // Third-party mod dependencies (Loom adds the Minecraft/Fabric ones).
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://jitpack.io" }
    mavenLocal()
}

configurations {
    modIncludeImplementation

    include.extendsFrom modIncludeImplementation
    modImplementation.extendsFrom modIncludeImplementation

    // Resolvable view of the new-runtime modules for fat-jar bundling below.
    bundleLibs {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API. This is technically optional, but you probably want it anyway.
    // NOTE: pinned module coordinates instead of fabricApi.module(...) BOM
    // lookups (fabric_version=0.18.0+build.387-1.16.1): the BOM POM is not
    // always resolvable, while these exact module versions are the set the
    // BOM resolves to (verified in the loom-cache argFiles of a working run).
    modIncludeImplementation("net.fabricmc.fabric-api:fabric-api-base:0.3.0+c88702897d")
    modIncludeImplementation("net.fabricmc.fabric-api:fabric-commands-v0:0.2.0+52d3083602")
    modIncludeImplementation("net.fabricmc.fabric-api:fabric-command-api-v1:1.1.2+95b14da07d")
    modIncludeImplementation("net.fabricmc.fabric-api:fabric-resource-loader-v0:0.2.6+f41e209802")
    modIncludeImplementation("net.fabricmc.fabric-api:fabric-lifecycle-events-v1:1.2.0+e83e061c02")
    modIncludeImplementation("net.fabricmc.fabric-api:fabric-key-binding-api-v1:1.0.1+f404f3be02")
    // New runtime: shared engine bundled into the mod jar below.
    // Plain `implementation` (not `modIncludeImplementation`): the full Loom
    // plugin reads `mod*` project jars eagerly at configuration time, which
    // breaks clean builds; the classes are bundled into the mod jar by the
    // `jar` task below instead of Jar-in-Jar (shared modules carry no
    // fabric.mod.json, so nesting would only add loader noise).
    implementation project(':common')
    implementation project(':practices')
    implementation project(':seed-search')
    bundleLibs project(':common')
    bundleLibs project(':practices')
    bundleLibs project(':seed-search')
    modIncludeImplementation("com.github.Gregor0410:PTLib:906f01fdb7")
    modIncludeImplementation("me.shedaniel.cloth:config-2:4.6.0") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnlyApi "com.github.RedLime:SpeedRunIGT:f742cbaf81"

    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    useJUnit()
}

def verificationServerJavaVersion = project.findProperty('speedrunPracticeServerJavaVersion')
if (verificationServerJavaVersion != null) {
    tasks.matching { it.name == 'runServer' }.configureEach {
        if (it instanceof JavaExec) {
            it.javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(
                        Integer.parseInt(verificationServerJavaVersion.toString()))
            }
        }
    }
}

// Verification suites create/delete 100+ worlds per run; the default
// runServer heap is too small for the aggregate suites.
def verificationServerHeap = project.findProperty('speedrunPracticeServerHeap')
if (verificationServerHeap != null && !verificationServerHeap.toString().trim().isEmpty()) {
    tasks.matching { it.name == 'runServer' }.configureEach {
        if (it instanceof JavaExec) {
            it.maxHeapSize = verificationServerHeap.toString().trim()
        }
    }
}

// Verification probes are compiled only for the dedicated verification
// artifact. They are deliberately outside src/main so release jars cannot
// load or execute them.
sourceSets {
    verification {
        java.srcDir 'verification/src/main/java'
        resources.srcDir 'verification/src/main/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

configurations {
    verificationImplementation.extendsFrom implementation, modImplementation, modIncludeImplementation
}

dependencies {
    verificationImplementation rootProject.project(':verification:common')
}

tasks.named('compileVerificationJava') {
    // Reuse Loom's mapped main compile classpath; a plain source set would
    // otherwise see intermediary Fabric classes instead of the names used by
    // these version-local probes.
    classpath = project.files(tasks.named('compileJava').get().classpath,
            sourceSets.main.output, configurations.getByName('verificationCompileClasspath'))
}

tasks.register('verificationJar', Jar) {
    dependsOn tasks.named('compileVerificationJava')
    dependsOn rootProject.project(':verification:common').tasks.named('jar')
    archiveBaseName = 'speedrun-practice-verification-1.16.1'
    from sourceSets.verification.output
    from { zipTree(rootProject.project(':verification:common').tasks.named('jar').get().archiveFile) }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 8
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

base {
    archivesName = 'speedrun-practice-1.16.1'
}

jar {
    // Execution-time ordering for the bundling below (no artifact reads at
    // configuration time, so Loom's eager-jar problem stays fixed).
    dependsOn project(':common').tasks.named('jar')
    dependsOn project(':practices').tasks.named('jar')
    dependsOn project(':seed-search').tasks.named('jar')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("${rootProject.projectDir}/LICENSE") {
        rename { "${it}_speedrun-practice" }
    }
    // Bundle the new-runtime modules' classes. The closure defers artifact
    // resolution to execution time so Loom never reads the module jars
    // during configuration (which breaks clean builds).
    from { configurations.bundleLibs.collect { zipTree(it) } }
    exclude '**/Temp*Probe*'
    exclude '**/VerificationEntrypoint*'
    exclude '**/verification/**'
}
