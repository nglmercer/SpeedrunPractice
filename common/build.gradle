plugins {
    id 'java-library'
}

group = 'com.gregor0410'
description = 'Minecraft-independent practice engine core. MUST NOT import net.minecraft.* (plan section 2).'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}

dependencies {
    // No runtime dependencies on purpose: common must stay dependency-free
    // so every Minecraft target can consume it.
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    useJUnit()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// Architecture guardrail (plan section 49): fail the build if shared code
// touches Minecraft/Fabric classes. Mirrored by scripts/verify-architecture.sh
// (Linux/macOS) and scripts/verify-architecture.ps1 (Windows).
tasks.register('verifyNoMinecraftImports') {
    doLast {
        def violations = []
        fileTree(dir: 'src/main/java', include: '**/*.java').each { f ->
            int n = 0
            f.eachLine { line ->
                n++
                if (line ==~ /\s*import\s+net\.minecraft\..*/ || line ==~ /\s*import\s+net\.fabricmc\..*/) {
                    violations.add("${f.name}:${n}: ${line.trim()}")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("common/ imports Minecraft/Fabric classes:\n" + violations.join('\n'))
        }
    }
}
tasks.named('check') { dependsOn 'verifyNoMinecraftImports' }
